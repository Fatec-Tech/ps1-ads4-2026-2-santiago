<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Pacientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4">Cadastro de Pacientes</h1>

    <div id="mensagem"></div>

    <form id="form-paciente" class="row g-3 mb-4">
      <input type="hidden" id="id">
      <div class="col-md-4">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" id="nome" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label for="nascimento" class="form-label">Nascimento</label>
        <input type="date" id="nascimento" class="form-control" required>
      </div>
      <div class="col-12">
        <button type="submit" id="btn-salvar" class="btn btn-primary">Salvar</button>
        <button type="button" id="btn-cancelar" class="btn btn-secondary d-none">Cancelar</button>
      </div>
    </form>

    <h2 class="h4">Pacientes cadastrados</h2>
    <p id="carregando" class="text-muted">Carregando pacientes... (a primeira requisição pode levar cerca de 1 minuto no servidor gratuito)</p>

    <table class="table table-striped">
      <thead>
        <tr><th>Nome</th><th>E-mail</th><th>Nascimento</th><th>Ações</th></tr>
      </thead>
      <tbody id="tabela-pacientes"></tbody>
    </table>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
